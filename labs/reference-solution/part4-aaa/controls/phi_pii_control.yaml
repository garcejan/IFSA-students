# Part 4 Step 5 — declarative policy instead of code (ADK 2.15.0).
#
# Binds to agent_pre_invoke / agent_post_invoke — the SAME hook as the plugins above.
# Reach for a control when the policy is generic and configurable; reach for a plugin
# when it is your business logic.
#
# ⚠ `controls import` is CREATE-ONLY. Re-running it fails with
#   `400 Policy binding with name "..." already exists` — remove first.
# ⚠ `--config` is NOT validated against the artifact schema: a mistyped key is stored
#   verbatim and the control silently runs on defaults (everything off). Copy key names
#   from `orchestrate controls get-type -n pii_filter -v`.
# ⚠ `controls export` writes the agent DISPLAY name, which import cannot resolve.
#   Keep this hand-written file in Git; treat export as read-only inspection.
spec_version: v1
kind: control
control:
  artifact_name: pii_filter
  name: phi_pii_guard
  display_name: PHI PII Guard
  description: Redact patient identifiers in Dr House agent input and output
  hooks:
    - agent_pre_invoke
    - agent_post_invoke
  priority: 50
  config:
    detect_ssn: true
    detect_email: true
    detect_phone: true
    detect_medical_record: true
    default_mask_strategy: redact
    redaction_text: "[PHI-REDACTED]"
    log_detections: true
  agent_names:
    - dr_house          # snake_case name, NOT the display name
