<!doctype html>
<meta charset="utf-8">
<title>wxO AAA Demo</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --bg:#fff; --mut:#666; --line:#d8d8d8; --acc:#0f62fe; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8e8; --bg:#161616; --mut:#9a9a9a; --line:#393939; } }
  body { font: 15px/1.5 system-ui, sans-serif; margin:0; color:var(--fg); background:var(--bg); }
  header { background:var(--acc); color:#fff; padding:14px 20px; display:flex; gap:12px; align-items:center; }
  header b { font-size:17px; } header span { opacity:.85; font-size:13px; }
  #who { margin-left:auto; font-size:13px; display:flex; gap:10px; align-items:center; }
  main { max-width:820px; margin:0 auto; padding:20px; }
  .msg { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:10px 0; white-space:pre-wrap; }
  .me { background:color-mix(in srgb, var(--acc) 8%, transparent); }
  .meta { color:var(--mut); font-size:12px; margin-top:6px; }
  form { display:flex; gap:8px; margin-top:16px; }
  input[type=text] { flex:1; padding:10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { padding:10px 16px; border:0; border-radius:6px; background:var(--acc); color:#fff; cursor:pointer; }
  .roles { font-family:ui-monospace,monospace; }
</style>
<header>
  <b>Diagnostics Desk</b><span>AAA demo · watsonx Orchestrate</span>
  <div id="who"></div>
</header>
<main>
  <div id="log"></div>
  <form id="f"><input type="text" id="q" placeholder="Ask about a patient…" autocomplete="off"><button>Send</button></form>
</main>
<script>
const log = document.getElementById('log'), who = document.getElementById('who');
let thread = null;

function add(text, cls, meta) {
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || '');
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  log.appendChild(d); d.scrollIntoView({ block:'end' });
}

async function me() {
  const r = await fetch('/auth/me');
  if (!r.ok) { who.innerHTML = '<a href="/auth/login" style="color:#fff">Sign in</a>'; return null; }
  const u = await r.json();
  // Showing the roles makes the RBAC lesson visible: same app, different roles, different agent.
  who.innerHTML = `${u.name} · <span class="roles">roles: [${(u.roles||[]).join(', ') || 'none'}]</span>
                   <button onclick="fetch('/auth/logout',{method:'POST'}).then(()=>location.reload())">Sign out</button>`;
  return u;
}

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById('q');
  if (!q.value.trim()) return;
  add(q.value, 'me');
  const body = { message: q.value, thread_id: thread };
  q.value = '';
  const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) return add('Error: ' + d.error);
  thread = d.thread_id;
  add(d.text || '(empty reply — if you were blocked by the pre-invoke gate you may see your own message echoed back)',
      '', `tools: [${(d.tools||[]).join(', ') || 'none'}] · run ${d.run_id?.slice(0,8)} · trace ${d.trace_id?.slice(0,8) || 'none — blocked turns produce no trace'}`);
};
me();
</script>
