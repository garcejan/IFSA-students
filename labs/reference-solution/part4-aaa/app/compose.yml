# podman-compose up --build     (or: docker compose up --build)
services:
  aaa-demo:
    build:
      context: .
      containerfile: Containerfile
    image: localhost/wxo-aaa-demo:latest
    ports:
      - "3000:3000"
    environment:
      # --- IBM App ID (from Service credentials in the App ID console) ---
      APPID_OAUTH_SERVER_URL: ${APPID_OAUTH_SERVER_URL}
      APPID_CLIENT_ID:        ${APPID_CLIENT_ID}
      APPID_CLIENT_SECRET:    ${APPID_CLIENT_SECRET}
      # --- watsonx Orchestrate ---
      WXO_INSTANCE_URL:       ${WXO_INSTANCE_URL}
      WXO_API_KEY:            ${WXO_API_KEY}
      WXO_AGENT_NAME:         ${WXO_AGENT_NAME:-dr_house}
      # --- app ---
      APP_BASE_URL:           ${APP_BASE_URL:-http://localhost:3000}
      SESSION_SECRET:         ${SESSION_SECRET}
      REQUIRED_ROLE:          ${REQUIRED_ROLE:-attending}
    env_file:
      - .env
    restart: unless-stopped
