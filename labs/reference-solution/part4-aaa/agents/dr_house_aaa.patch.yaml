# Part 4 — the fragments to ADD to your Part 1 dr_house agent YAML.
# Not a standalone agent: merge these blocks into the existing definition so you keep
# its instructions, tools, collaborators and skills.

# --- Step 2: the allowlist. EXCLUSIVE — omit wxo_run_id/wxo_thread_id and they vanish
#     from your tools, which breaks the audit join in Step 6.
context_variables:
  - roles
  - email
  - sub
  - clientID
  - wxo_run_id
  - wxo_thread_id
  - wxo_user_name

# --- Step 3: the all-or-nothing gate.
#     ⚠ PluginRef OBJECTS, not strings. `- phi_gate` fails import with
#       "Input should be a valid dictionary or instance of PluginRef".
plugins:
  agent_pre_invoke:
    - plugin_name: phi_gate
  agent_post_invoke: []

# --- Step 4: swap the gate for tool filtering (use ONE of the two, not both, until the
#     plugin-ordering question in Step 5 is settled).
# plugins:
#   agent_pre_invoke:
#     - plugin_name: phi_tool_filter
#   agent_post_invoke: []
